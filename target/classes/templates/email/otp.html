<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mã OTP đặt lại mật khẩu</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .header { background: #2e7d32; padding: 30px; text-align: center; color: #fff; }
        .header h1 { margin: 0; font-size: 24px; }
        .body { padding: 30px; color: #333; }
        .otp { font-size: 36px; font-weight: bold; letter-spacing: 10px; color: #2e7d32; text-align: center; padding: 20px; background: #f1f8e9; border-radius: 8px; margin: 20px 0; }
        .footer { padding: 20px 30px; font-size: 12px; color: #999; border-top: 1px solid #eee; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🌿 Thực Phẩm Sạch</h1>
    </div>
    <div class="body">
        <p>Xin chào <strong th:text="${fullName}">Khách hàng</strong>,</p>
        <p>Bạn đã yêu cầu đặt lại mật khẩu. Đây là mã OTP của bạn:</p>
        <div class="otp" th:text="${otp}">000000</div>
        <p>Mã OTP có hiệu lực trong <strong>10 phút</strong>.</p>
        <p>Nếu bạn không yêu cầu đặt lại mật khẩu, hãy bỏ qua email này.</p>
    </div>
    <div class="footer">
        <p>© 2024 Thực Phẩm Sạch. Mọi quyền được bảo lưu.</p>
    </div>
</div>
</body>
</html>
