spring.application.name=backend-ecommerce

# =============================================
# SERVER
# =============================================
server.port=8080

# =============================================
# DATABASE - MS SQL SERVER
# =============================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ecommerce_db;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# =============================================
# JPA / HIBERNATE
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Removed explicit dialect - Hibernate auto-detects it
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# =============================================
# JWT
# =============================================
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration=86400000

# =============================================
# FILE UPLOAD / MULTIPART
# =============================================
app.upload.dir=uploads/
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.resolve-lazily=false

# =============================================
# MAIL - Gmail
# Bước 1: Bật 2-Step Verification trên Gmail
# Bước 2: Google Account > Security > App passwords > Tạo mật khẩu 16 ký tự
# Nếu không cấu hình email, các lỗi mail sẽ được log nhưng không block các operation
# =============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-16-char-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=your-email@gmail.com

# =============================================
# FRONTEND URL
# =============================================
app.frontend.url=http://localhost:5173

# =============================================
# OAUTH2 - GOOGLE LOGIN
# Lấy tại: console.cloud.google.com > APIs & Services > Credentials
# =============================================
# Tạm disable - login bằng email/password trước
#spring.security.oauth2.client.registration.google.client-id=148133746823-ja9pijsm6qoompn0bmcptptps9mticr4.apps.googleusercontent.com
#spring.security.oauth2.client.registration.google.client-secret=YOUR_ACTUAL_SECRET
#spring.security.oauth2.client.registration.google.scope=email,profile

# =============================================
# LOGGING
# =============================================
logging.level.com.thucphamsach=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.apache.tomcat.jni=OFF
logging.level.org.springframework.boot=WARN